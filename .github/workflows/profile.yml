name: Refresh profile evidence

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    paths: ["profile.json", "scripts/**"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the board, cases and record
        run: python scripts/build_assets.py
      - name: Pull GitHub stats and languages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/make_stats.py
      - name: Commit if anything changed
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile evidence"
            git push
          fi
